spring.application.name=jobqueue

# Where the database is, and how to log in
spring.datasource.url=jdbc:postgresql://localhost:5432/jobqueue
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Flyway creates the tables. Hibernate only checks they match our Java classes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false